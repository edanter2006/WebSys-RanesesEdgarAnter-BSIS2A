<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 3 - Raneses</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>L3 CSS Web Page</h1>
        <nav>
            <ul>
                <li><a href="#about">About</a></li>
                <li><a href="#services">Services</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="about">
            <h2>About Us</h2>
            <p>We are currently on our learning phase and will be for a while, please return another time.</p>
        </section>
        <section id="services">
            <h2>Services</h2>
            <p>Our Services are currently unavailable at the moment, we apologize for any inconveniences.</p>
        </section>
        <section id="contact">
            <h2>Contact Us</h2>
            <form>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
                <label for="message">Message:</label>
                <textarea id="message" name="message" required></textarea>
                <button type="submit">Send</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2025 Your Company Name</p>
    </footer>
</body>
</html>
