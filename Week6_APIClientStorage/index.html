<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 6 - Raneses</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <h1>L6 Local Storage API</h1>
    </header>
    <main>
        <section id="about">
            <h2>Save User Preferences</h2>
            <label for="username">Enter Username:</label>
            <input type="text" id="username">
            <button onclick="saveData()">Save</button>
            <button onclick="loadData()">Load</button>
            <p id="display"></p>
            
            <script>
                function saveData()
                {
                    let name =document.getElementById("username").value;
                    localStorage.setItem("userName", name);
                    alert("Data Saved!");
                }
                function loadData()
                {
                    let name = localStorage.getItem("userName");
                    document.getElementById("display").innerText = name ? "Welcome " + name + "!": "No Username Detected";
                }
            </script>
        </section>

        <section>
            <h3>Weather Checker</h3>
            <label for="city">Enter City:</label>
            <input type="text" id="city">
            <button onclick="getWeather()">Get Weather</button>
            <p id="weatherResult"></p>
            
            <script>
                function getWeather() {
                    let city = document.getElementById("city").value;
                    let apiKey = "b7056ba5ace1314cfff93c2d6a27668a"; // Replace with your OpenWeatherMap API key
                    let url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`;
                    
                    fetch(url)
                        .then(response => response.json())
                        .then(data => {
                            document.getElementById("weatherResult").innerHTML = `
                            <p>Temperature: ${data.main.temp}°C</p>
                            <img src="https://openweathermap.org/img/w/${data.weather[0].icon}.png">
                            <p>${data.weather[0].description}</p>
                            `;
                        });
                }
            </script>
        </section>

        <section>
            <h3>GitHub User Lookup</h3>
            <input type="text" id="username1" placeholder="Enter GitHub Username">
            <button onclick="getUser()">Get User</button>
            <div id="userResult"></div>
        
            <script>
                function getUser() {
                    let username = document.getElementById("username1").value;
                    let url = `https://api.github.com/users/${username}`;
                    
                    fetch(url)
                        .then(response => response.json())
                        .then(data => {
                        document.getElementById("userResult").innerHTML = `
                            <h3>${data.name || "No Name Found"}</h3>
                            <img src="${data.avatar_url}" width="100">
                            <p>Public Repos: ${data.public_repos}</p>
                            <p>Followers: ${data.followers}</p>
                            `;
                        })
                        .catch(error => console.error("Error fetching GitHub data:", error));
                }
            </script>
        </section>
    </main>
    <footer>
        <p>&copy; 2025 Your Company Name</p>
    </footer>
</body>
</html>
